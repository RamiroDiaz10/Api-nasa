<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Navigator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <header>
        <div class="logo">
            <h1>NASA</h1>
            <span>EXPLORA</span>
        </div>

        <nav>
            <a href="#" class="active">HOME</a>
            <a href="#">Explora</a>
            <div class="search-box">
        <input
            type="text"
            placeholder="Buscar..."
        >
        <button>🔍</button>
        </nav>
    </header>

    <main>

        <section class="hero">

            <div class="hero-text">

                <h2>
                    El cosmos <br>
                
                </h2>

                <p>
                    Explora las maravillas del universo. 
                </p>

                <button>
                    EMPECEMOS ✦
                </button>

            </div>

            <div class="hero-image">
                <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564" alt="">
            </div>

        </section>

        <section class="cards">

            <div class="card">
                <h3>Estrellas</h3>
                 <img src="imagen2.png" alt="Estrellas" class="card-img">
            </div>

            <div class="card">
                <h3>Planetas</h3>
                <img src="imagen3.png" alt="Planetas" class="card-img">
            </div>

            <div class="card">
                <h3>Cometas</h3>
                <img src="imagen4.png" alt="Cometas" class="card-img">
            </div>

        </section>

    </main>

    <footer>
         <p>API-NASA</p>
        <p>© 2026  NASA</p>
    </footer>

</body>
</html>
